# Task configuration for PromptForge orchestration

intent_detection_task:
  description: >
    You are the Intent Detection Agent. Analyze the user request and extract the real intent.
    User request:
    {user_input}

    Generation preferences:
    {generation_brief}

    Regeneration context (may be empty):
    {regeneration_context}
    Regeneration attempt: {regeneration_attempt}

    Output strict JSON only. No markdown, no commentary, no code fences.
    Do not include chain-of-thought. Provide only concise reasoning summaries.

    Required JSON schema:
    {
      "artifact": "intent_profile",
      "version": "1.0",
      "data": {
        "primary_intent": "...",
        "user_goal": "...",
        "success_outcome": "...",
        "audience": "...",
        "constraints": ["..."],
        "non_negotiables": ["..."],
        "preferred_tone": "...",
        "explicit_requirements": ["..."],
        "implicit_requirements": ["..."],
        "do_not_do": ["..."],
        "clarifying_questions": ["..."],
        "assumptions": ["..."],
        "rationale_summary": "..."
      }
    }

  expected_output: >
    A single valid JSON object matching the intent_profile schema.
  agent: intent_detector

task_classification_task:
  description: >
    You are the Task Classification Agent. Use the latest intent_profile to classify the task.
    Classify into categories such as: backend development, frontend UI generation, debugging,
    DevOps, research, content generation, AI automation, architecture design, data engineering,
    mobile app development, system design, documentation, testing, database engineering,
    cybersecurity, machine learning, LLM applications.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "task_classification",
      "version": "1.0",
      "data": {
        "primary_category": "...",
        "secondary_categories": ["..."],
        "task_type": "...",
        "domain_tags": ["..."],
        "confidence": 0.0,
        "classification_rationale": "..."
      }
    }

  expected_output: >
    A single valid JSON object matching the task_classification schema.
  agent: task_classifier

complexity_estimation_task:
  description: >
    You are the Complexity Estimation Agent. Use intent_profile and task_classification to estimate
    complexity and refinement depth.

    Complexity levels: simple, medium, advanced, enterprise.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "complexity_estimate",
      "version": "1.0",
      "data": {
        "complexity_level": "simple|medium|advanced|enterprise",
        "drivers": ["..."],
        "reasoning_depth": "light|moderate|deep",
        "planning_depth": "light|moderate|deep",
        "token_budget_hint": "...",
        "refinement_passes": 0,
        "verification_intensity": "light|moderate|high"
      }
    }

  expected_output: >
    A single valid JSON object matching the complexity_estimate schema.
  agent: complexity_estimator

context_gathering_task:
  description: >
    You are the Context Gathering Agent. Use intent_profile and task_classification to collect
    only the most relevant repo context. When project files are relevant, call the repo_context_tool
    to read curated excerpts. Do not dump raw files. Summarize high-signal details only.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "context_brief",
      "version": "1.0",
      "data": {
        "context_summary": "...",
        "frameworks": ["..."],
        "architecture_patterns": ["..."],
        "dependencies": ["..."],
        "key_files": ["..."],
        "context_snippets": ["..."],
        "constraints": ["..."],
        "context_gaps": ["..."]
      }
    }

  expected_output: >
    A single valid JSON object matching the context_brief schema.
  agent: context_gatherer

missing_information_task:
  description: >
    You are the Missing Information Detection Agent. Use intent_profile and context_brief to
    identify missing details and high-risk assumptions. Provide precise questions that improve
    prompt execution.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "missing_information",
      "version": "1.0",
      "data": {
        "missing_info": ["..."],
        "clarifying_questions": ["..."],
        "assumptions": ["..."],
        "risk_notes": ["..."],
        "proceed_without_answers": true
      }
    }

  expected_output: >
    A single valid JSON object matching the missing_information schema.
  agent: info_gap_detector

prompt_strategy_task:
  description: >
    You are the Prompt Strategy Selection Agent. Use intent_profile, task_classification,
    complexity_estimate, context_brief, and missing_information to choose prompting techniques.

    Supported techniques include: Chain of Thought (hidden), Tree of Thoughts, ReAct,
    Few-shot, Zero-shot, Self-reflection, XML structured prompting, Constraint prompting,
    Planning-first, Tool-use, Role prompting, Step-by-step reasoning (hidden),
    Deliberate reasoning (hidden), Multi-stage prompting, Critique and refinement,
    Output schema prompting, Function-calling aware prompting, Retrieval-augmented prompting,
    Agentic workflow prompting.

    Do not ask the model to reveal chain-of-thought. Use short rationale summaries only.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "prompt_strategy",
      "version": "1.0",
      "data": {
        "selected_techniques": [
          {
            "name": "...",
            "when": "...",
            "how": "...",
            "expected_benefit": "...",
            "risk_controls": ["..."]
          }
        ],
        "excluded_techniques": ["..."],
        "reasoning_policy": "...",
        "tool_use_policy": "...",
        "output_control_strategy": "...",
        "strategy_rationale": "..."
      }
    }

  expected_output: >
    A single valid JSON object matching the prompt_strategy schema.
  agent: prompt_strategy_selector

prompt_architecture_task:
  description: >
    You are the Prompt Architect Agent. Use prompt_strategy, complexity_estimate, context_brief,
    and missing_information to design the prompt architecture and execution flow.

    The prompt must include layers: System Role, Objective, Context, Execution Strategy,
    Constraints, Output Format, Validation Rules, Quality Expectations, Edge Cases,
    Self-Verification Instructions.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "prompt_architecture",
      "version": "1.0",
      "data": {
        "prompt_layers": ["System Role", "Objective", "Context", "Execution Strategy", "Constraints",
          "Output Format", "Validation Rules", "Quality Expectations", "Edge Cases", "Self-Verification Instructions"],
        "section_intents": {
          "System Role": "...",
          "Objective": "...",
          "Context": "...",
          "Execution Strategy": "...",
          "Constraints": "...",
          "Output Format": "...",
          "Validation Rules": "...",
          "Quality Expectations": "...",
          "Edge Cases": "...",
          "Self-Verification Instructions": "..."
        },
        "formatting_rules": ["..."],
        "execution_flow": ["..."],
        "schema_guidance": "...",
        "rationale_summary": "..."
      }
    }

  expected_output: >
    A single valid JSON object matching the prompt_architecture schema.
  agent: prompt_architect

prompt_construction_task:
  description: >
    You are the Prompt Construction Agent. Build the full prompt using prompt_architecture,
    prompt_strategy, context_brief, and intent_profile. Enforce model, prompt_mode, and
    response_length controls: model={model}, prompt_mode={prompt_mode}, response_length={response_length}.

    The final prompt must be execution-focused, reasoning-aware, and context-aware. Avoid generic
    business language and filler. Provide explicit constraints and output controls.

    Output strict JSON only. No markdown, no commentary. Use arrays of lines for prompt text.

    Required JSON schema:
    {
      "artifact": "prompt_draft",
      "version": "1.0",
      "data": {
        "final_prompt_lines": ["..."],
        "prompt_sections": [
          {"name": "System Role", "lines": ["..."]},
          {"name": "Objective", "lines": ["..."]}
        ],
        "assumptions_used": ["..."],
        "quality_checks_applied": ["..."],
        "prompt_mode": "...",
        "response_length": "..."
      }
    }

  expected_output: >
    A single valid JSON object matching the prompt_draft schema.
  agent: prompt_constructor

reflection_critique_task:
  description: >
    You are the Reflection and Critique Agent. Review the latest prompt_draft and identify
    weaknesses, ambiguity, missing constraints, and hallucination risks. Provide concrete fixes.

    Output strict JSON only. No markdown, no commentary.

    Required JSON schema:
    {
      "artifact": "prompt_critique",
      "version": "1.0",
      "data": {
        "strengths": ["..."],
        "weaknesses": ["..."],
        "risk_score": 0,
        "revision_actions": ["..."],
        "missing_context": ["..."],
        "tone_issues": ["..."]
      }
    }

  expected_output: >
    A single valid JSON object matching the prompt_critique schema.
  agent: reflection_critic

prompt_optimization_task:
  description: >
    You are the Prompt Optimization Agent. Apply prompt_critique to improve the prompt.
    Produce an optimized prompt that resolves the issues without adding filler.

    Output strict JSON only. No markdown, no commentary. Use arrays of lines for prompt text.

    Required JSON schema:
    {
      "artifact": "prompt_optimized",
      "version": "1.0",
      "data": {
        "optimized_prompt_lines": ["..."],
        "changes_applied": ["..."],
        "resolved_issues": ["..."],
        "open_issues": ["..."]
      }
    }

  expected_output: >
    A single valid JSON object matching the prompt_optimized schema.
  agent: prompt_optimizer

validation_task:
  description: >
    You are the Prompt Validation and Scoring Agent. Validate the best available prompt
    (prefer prompt_optimized, else prompt_draft). Score quality dimensions and decide if
    regeneration is required.

    Quality dimensions: clarity, specificity, reasoning_quality, hallucination_prevention,
    context_usage, execution_structure, instruction_quality, output_control, architecture_guidance.

    Output strict JSON only. No markdown, no commentary. Use arrays of lines for prompt text.

    Required JSON schema:
    {
      "artifact": "validation_report",
      "version": "1.0",
      "data": {
        "scores": {
          "clarity": 0,
          "specificity": 0,
          "reasoning_quality": 0,
          "hallucination_prevention": 0,
          "context_usage": 0,
          "execution_structure": 0,
          "instruction_quality": 0,
          "output_control": 0,
          "architecture_guidance": 0
        },
        "overall_score": 0,
        "final_status": "approved|revise",
        "regeneration_recommendation": "...",
        "final_prompt_lines": ["..."]
      }
    }

  expected_output: >
    A single valid JSON object matching the validation_report schema.
  agent: validation_scorer
